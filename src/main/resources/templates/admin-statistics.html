<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Admin - Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div layout:fragment="content">
    <div class="container">
        <h1>Statistics</h1>

        <!-- Game Type Filter -->
        <div class="card mt-4">
            <div class="card-body">
                <h5>Filter by Game Type</h5>
                <div class="btn-group" role="group">
                    <a th:href="@{/admin/statistics(days=${selectedDays})}" 
                       th:classappend="${selectedGameType == 'ALL'} ? 'active' : ''"
                       class="btn btn-outline-primary">All Games</a>
                    <a th:href="@{/admin/statistics(gameType='PVP', days=${selectedDays})}" 
                       th:classappend="${selectedGameType == 'PVP'} ? 'active' : ''"
                       class="btn btn-outline-primary">PVP</a>
                    <a th:href="@{/admin/statistics(gameType='PRACTICE', days=${selectedDays})}" 
                       th:classappend="${selectedGameType == 'PRACTICE'} ? 'active' : ''"
                       class="btn btn-outline-primary">Practice</a>
                </div>
                
                <h5 class="mt-3">Filter by Date Range</h5>
                <div class="btn-group" role="group">
                    <a th:href="@{/admin/statistics(gameType=${selectedGameType != 'ALL' ? selectedGameType : null}, days=1)}" 
                       th:classappend="${selectedDays == 1} ? 'active' : ''"
                       class="btn btn-outline-secondary">Last 1 Day</a>
                    <a th:href="@{/admin/statistics(gameType=${selectedGameType != 'ALL' ? selectedGameType : null}, days=7)}" 
                       th:classappend="${selectedDays == 7} ? 'active' : ''"
                       class="btn btn-outline-secondary">Last 7 Days</a>
                    <a th:href="@{/admin/statistics(gameType=${selectedGameType != 'ALL' ? selectedGameType : null}, days=30)}" 
                       th:classappend="${selectedDays == 30} ? 'active' : ''"
                       class="btn btn-outline-secondary">Last 30 Days</a>
                    <a th:href="@{/admin/statistics(gameType=${selectedGameType != 'ALL' ? selectedGameType : null}, days=90)}" 
                       th:classappend="${selectedDays == 90} ? 'active' : ''"
                       class="btn btn-outline-secondary">Last 90 Days</a>
                </div>
            </div>
        </div>

        <!-- Per-Player Statistics -->
        <div class="card mt-4">
            <div class="card-header">
                <h2>Player Statistics</h2>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-12">
                        <h4>Win Counts by Player</h4>
                        <canvas id="playerWinCountsChart"></canvas>
                    </div>
                </div>
                <div class="row mt-4">
                    <div class="col-md-6">
                        <h4>Card Usage by Player</h4>
                        <div id="playerCardUsageCharts"></div>
                    </div>
                    <div class="col-md-6">
                        <h4>Magic Usage by Player</h4>
                        <div id="playerMagicUsageCharts"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Card Statistics -->
        <div class="card mt-4">
            <div class="card-header">
                <h2>Card Statistics</h2>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <canvas id="cardTotalPlaysChart"></canvas>
                    </div>
                    <div class="col-md-6">
                        <canvas id="cardWinsChart"></canvas>
                    </div>
                </div>
                <div class="row mt-4">
                    <div class="col-md-6">
                        <canvas id="cardWinRateChart"></canvas>
                    </div>
                    <div class="col-md-6">
                        <canvas id="cardUsageRatioChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Magic Statistics -->
        <div class="card mt-4">
            <div class="card-header">
                <h2>Magic Statistics</h2>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <canvas id="magicTotalPlaysChart"></canvas>
                    </div>
                    <div class="col-md-6">
                        <canvas id="magicWinsChart"></canvas>
                    </div>
                </div>
                <div class="row mt-4">
                    <div class="col-md-6">
                        <canvas id="magicWinRateChart"></canvas>
                    </div>
                    <div class="col-md-6">
                        <canvas id="magicUsageRatioChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const cardWinCounts = /*[[${cardWinCounts}]]*/ {};
        const magicWinCounts = /*[[${magicWinCounts}]]*/ {};
        const cardGameCounts = /*[[${cardGameCounts}]]*/ {};
        const magicGameCounts = /*[[${magicGameCounts}]]*/ {};
        const cardUseCounts = /*[[${cardUseCounts}]]*/ {};
        const magicUseCounts = /*[[${magicUseCounts}]]*/ {};
        const playerWinCounts = /*[[${playerWinCounts}]]*/ {};
        const playerCardUsage = /*[[${playerCardUsage}]]*/ {};
        const playerMagicUsage = /*[[${playerMagicUsage}]]*/ {};

        // Reusable chart colors
        const chartBackgroundColors = [
            'rgba(255, 99, 132, 0.6)',
            'rgba(54, 162, 235, 0.6)',
            'rgba(255, 206, 86, 0.6)',
            'rgba(75, 192, 192, 0.6)',
            'rgba(153, 102, 255, 0.6)',
            'rgba(255, 159, 64, 0.6)'
        ];

        const pieChartBackgroundColors = [
            'rgba(255, 99, 132, 0.2)',
            'rgba(54, 162, 235, 0.2)',
            'rgba(255, 206, 86, 0.2)',
            'rgba(75, 192, 192, 0.2)',
            'rgba(153, 102, 255, 0.2)',
            'rgba(255, 159, 64, 0.2)'
        ];

        const pieChartBorderColors = [
            'rgba(255, 99, 132, 1)',
            'rgba(54, 162, 235, 1)',
            'rgba(255, 206, 86, 1)',
            'rgba(75, 192, 192, 1)',
            'rgba(153, 102, 255, 1)',
            'rgba(255, 159, 64, 1)'
        ];

        // Helper function to create chart data
        function createChartData(data) {
            const labels = Object.keys(data);
            const values = Object.values(data);
            return { labels, values };
        }

        // Helper function to check if object has data
        function hasData(obj) {
            return obj && Object.keys(obj).length > 0;
        }

        // Player Win Counts Chart
        const playerWinCountsData = createChartData(playerWinCounts);
        new Chart(document.getElementById('playerWinCountsChart'), {
            type: 'bar',
            data: {
                labels: playerWinCountsData.labels.map(id => `Player ${id}`),
                datasets: [{
                    label: 'Win Count',
                    data: playerWinCountsData.values,
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Player Card Usage Charts
        const playerCardUsageContainer = document.getElementById('playerCardUsageCharts');
        Object.entries(playerCardUsage).forEach(([playerId, cardUsage]) => {
            // Skip if player has no card usage data
            if (!hasData(cardUsage)) {
                return;
            }

            const canvasId = `playerCardUsage_${playerId}`;
            const canvas = document.createElement('canvas');
            canvas.id = canvasId;
            canvas.style.marginBottom = '20px';
            playerCardUsageContainer.appendChild(canvas);

            const cardData = createChartData(cardUsage);
            new Chart(canvas, {
                type: 'pie',
                data: {
                    labels: cardData.labels,
                    datasets: [{
                        label: `Player ${playerId} Card Usage`,
                        data: cardData.values,
                        backgroundColor: chartBackgroundColors
                    }]
                },
                options: {
                    plugins: {
                        title: {
                            display: true,
                            text: `Player ${playerId} - Card Usage`
                        }
                    }
                }
            });
        });

        // Player Magic Usage Charts
        const playerMagicUsageContainer = document.getElementById('playerMagicUsageCharts');
        Object.entries(playerMagicUsage).forEach(([playerId, magicUsage]) => {
            // Skip if player has no magic usage data
            if (!hasData(magicUsage)) {
                return;
            }

            const canvasId = `playerMagicUsage_${playerId}`;
            const canvas = document.createElement('canvas');
            canvas.id = canvasId;
            canvas.style.marginBottom = '20px';
            playerMagicUsageContainer.appendChild(canvas);

            const magicData = createChartData(magicUsage);
            new Chart(canvas, {
                type: 'pie',
                data: {
                    labels: magicData.labels,
                    datasets: [{
                        label: `Player ${playerId} Magic Usage`,
                        data: magicData.values,
                        backgroundColor: chartBackgroundColors
                    }]
                },
                options: {
                    plugins: {
                        title: {
                            display: true,
                            text: `Player ${playerId} - Magic Usage`
                        }
                    }
                }
            });
        });

        // Card Charts
        const cardTotalPlaysData = createChartData(cardGameCounts);
        new Chart(document.getElementById('cardTotalPlaysChart'), {
            type: 'bar',
            data: {
                labels: cardTotalPlaysData.labels,
                datasets: [{
                    label: 'Total Plays',
                    data: cardTotalPlaysData.values,
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            }
        });

        const cardWinsData = createChartData(cardWinCounts);
        new Chart(document.getElementById('cardWinsChart'), {
            type: 'bar',
            data: {
                labels: cardWinsData.labels,
                datasets: [{
                    label: 'Wins',
                    data: cardWinsData.values,
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1
                }]
            }
        });

        const cardWinRateLabels = cardTotalPlaysData.labels;
        const cardWinRateData = cardWinRateLabels.map(label => {
            const totalPlays = cardGameCounts[label] || 0;
            const wins = cardWinCounts[label] || 0;
            return totalPlays > 0 ? (wins / totalPlays) * 100 : 0;
        });

        new Chart(document.getElementById('cardWinRateChart'), {
            type: 'bar',
            data: {
                labels: cardWinRateLabels,
                datasets: [{
                    label: 'Win Rate',
                    data: cardWinRateData,
                    backgroundColor: 'rgba(153, 102, 255, 0.2)',
                    borderColor: 'rgba(153, 102, 255, 1)',
                    borderWidth: 1
                }, {
                    type: 'line',
                    label: 'Win Rate (Line)',
                    data: cardWinRateData,
                    backgroundColor: 'rgba(255, 159, 64, 0.2)',
                    borderColor: 'rgba(255, 159, 64, 1)',
                    borderWidth: 1
                }]
            }
        });

        const cardUsageData = createChartData(cardUseCounts);
        new Chart(document.getElementById('cardUsageRatioChart'), {
            type: 'pie',
            data: {
                labels: cardUsageData.labels,
                datasets: [{
                    label: 'Usage Ratio',
                    data: cardUsageData.values,
                    backgroundColor: pieChartBackgroundColors,
                    borderColor: pieChartBorderColors,
                    borderWidth: 1
                }]
            }
        });

        // Magic Charts
        const magicTotalPlaysData = createChartData(magicGameCounts);
        new Chart(document.getElementById('magicTotalPlaysChart'), {
            type: 'bar',
            data: {
                labels: magicTotalPlaysData.labels,
                datasets: [{
                    label: 'Total Plays',
                    data: magicTotalPlaysData.values,
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            }
        });

        const magicWinsData = createChartData(magicWinCounts);
        new Chart(document.getElementById('magicWinsChart'), {
            type: 'bar',
            data: {
                labels: magicWinsData.labels,
                datasets: [{
                    label: 'Wins',
                    data: magicWinsData.values,
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1
                }]
            }
        });

        const magicWinRateLabels = magicTotalPlaysData.labels;
        const magicWinRateData = magicWinRateLabels.map(label => {
            const totalPlays = magicGameCounts[label] || 0;
            const wins = magicWinCounts[label] || 0;
            return totalPlays > 0 ? (wins / totalPlays) * 100 : 0;
        });

        new Chart(document.getElementById('magicWinRateChart'), {
            type: 'bar',
            data: {
                labels: magicWinRateLabels,
                datasets: [{
                    label: 'Win Rate',
                    data: magicWinRateData,
                    backgroundColor: 'rgba(153, 102, 255, 0.2)',
                    borderColor: 'rgba(153, 102, 255, 1)',
                    borderWidth: 1
                }, {
                    type: 'line',
                    label: 'Win Rate (Line)',
                    data: magicWinRateData,
                    backgroundColor: 'rgba(255, 159, 64, 0.2)',
                    borderColor: 'rgba(255, 159, 64, 1)',
                    borderWidth: 1
                }]
            }
        });

        const magicUsageData = createChartData(magicUseCounts);
        new Chart(document.getElementById('magicUsageRatioChart'), {
            type: 'pie',
            data: {
                labels: magicUsageData.labels,
                datasets: [{
                    label: 'Usage Ratio',
                    data: magicUsageData.values,
                    backgroundColor: pieChartBackgroundColors,
                    borderColor: pieChartBorderColors,
                    borderWidth: 1
                }]
            }
        });
        /*]]>*/
    </script>
</div>

</body>
</html>
