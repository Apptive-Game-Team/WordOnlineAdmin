<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Admin - Game Object Comparison</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container">
        <h1>Game Object Deploy / Dev Comparison</h1>

        <div class="card mt-4">
            <div class="card-header"><h2>Game Objects</h2></div>
            <div class="card-body">
                <form id="createGameObjectForm" class="form-inline">
                    <input type="text" class="form-control" name="name"
                           placeholder="New Game Object Name" required>
                    <select class="form-control ml-2" name="db">
                        <option value="primary">Deploy</option>
                        <option value="secondary" th:disabled="${!secondaryDatabaseEnabled}">Dev</option>
                    </select>
                    <button type="submit" class="btn btn-primary ml-2">Create</button>
                </form>

                <div class="form-group mt-3">
                    <label for="game-object-search">Search</label>
                    <input type="text" class="form-control" id="game-object-search"
                           placeholder="Search by name">
                </div>

                <table class="table table-striped mt-3">
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Deploy</th>
                        <th>Dev</th>
                        <th>Parameters</th>
                    </tr>
                    </thead>
                    <tbody id="game-object-table-body">
                    <tr th:each="gameObject : ${gameObjects}">
                        <td th:text="${gameObject.name}"></td>
                        <td>
                            <span th:if="${!gameObject.primaryPresent}" class="text-muted">N/A</span>
                            <form th:if="${gameObject.primaryPresent}" class="database-form"
                                  data-db="primary" th:attr="data-current-name=${gameObject.name}">
                                <input type="text" name="name" th:value="${gameObject.name}"
                                       class="form-control d-inline w-auto">
                                <button type="submit" class="btn btn-sm btn-info">Update</button>
                                <button type="button" class="btn btn-sm btn-danger delete-button">Delete</button>
                            </form>
                        </td>
                        <td>
                            <span th:if="${!gameObject.secondaryPresent}" class="text-muted">N/A</span>
                            <form th:if="${gameObject.secondaryPresent}" class="database-form"
                                  data-db="secondary" th:attr="data-current-name=${gameObject.name}">
                                <input type="text" name="name" th:value="${gameObject.name}"
                                       class="form-control d-inline w-auto">
                                <button type="submit" class="btn btn-sm btn-info">Update</button>
                                <button type="button" class="btn btn-sm btn-danger delete-button">Delete</button>
                            </form>
                        </td>
                        <td>
                            <a th:href="@{/admin/game-object/by-name/{name}(name=${gameObject.name})}"
                               class="btn btn-sm btn-primary">Compare Parameters</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('game-object-search').addEventListener('input', function(event) {
            const query = event.target.value.trim().toLowerCase();
            document.querySelectorAll('#game-object-table-body tr').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
            });
        });

        document.getElementById('createGameObjectForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const data = new FormData(event.target);
            const response = await fetch(`/api/admin/game-objects/by-name?db=${data.get('db')}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: data.get('name'), parameterValues: []})
            });
            if (response.ok) {
                window.location.reload();
            } else {
                alert(await response.text());
            }
        });

        document.querySelectorAll('.database-form').forEach(form => {
            form.addEventListener('submit', async function(event) {
                event.preventDefault();
                const currentName = form.dataset.currentName;
                const newName = new FormData(form).get('name');
                const response = await fetch(
                    `/api/admin/game-objects/by-name/${encodeURIComponent(currentName)}?db=${form.dataset.db}`,
                    {
                        method: 'PATCH',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({name: newName, parameterValues: []})
                    }
                );
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert(await response.text());
                }
            });

            form.querySelector('.delete-button').addEventListener('click', async function() {
                const currentName = form.dataset.currentName;
                if (!confirm(`Delete ${currentName} from ${form.dataset.db}?`)) {
                    return;
                }
                const response = await fetch(
                    `/api/admin/game-objects/by-name/${encodeURIComponent(currentName)}?db=${form.dataset.db}`,
                    {method: 'DELETE'}
                );
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert(await response.text());
                }
            });
        });
    </script>
</div>
</body>
</html>
