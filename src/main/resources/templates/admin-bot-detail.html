<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head th:replace="~{layout :: header('Bot Detail')}"></head>
<body>
<main layout:fragment="content">
    <a th:href="@{/admin/bot}">← Bots</a>
    <h1 th:text="|${bot.name} (${bot.userId})|"></h1>
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <form method="post" th:action="@{/admin/bot/{id}(id=${bot.userId})}">
        <div class="row">
            <div class="col-md-6"><label>Name</label><input class="form-control" name="name" th:value="${bot.name}" required></div>
            <div class="col-md-3"><label>Tier</label><select class="form-select" name="tier"><option th:each="tier : ${ {'INTRO','BEGINNER','INTERMEDIATE','ADVANCED','ELITE'} }" th:value="${tier}" th:text="${tier}" th:selected="${tier == bot.tier}"></option></select></div>
            <div class="col-md-3"><label>MMR</label><input class="form-control" name="mmr" type="number" th:value="${bot.mmr}"></div>
            <div class="col-md-4 mt-2"><label>Thinking ms</label><input class="form-control" name="thinkingTimeMs" type="number" min="0" th:value="${bot.thinkingTimeMs}"></div>
            <div class="col-md-4 mt-2"><label>Reaction frames</label><input class="form-control" name="reactionIntervalFrames" type="number" min="1" th:value="${bot.reactionIntervalFrames}"></div>
            <div class="col-md-4 mt-2"><label>Counter aggression</label><input class="form-control" name="counterAggression" type="number" min="0" max="1" step="0.01" th:value="${bot.counterAggression}"></div>
        </div>
        <input type="hidden" name="status" th:value="${bot.status}"><input type="hidden" name="enabled" th:value="${bot.enabled}">
        <button class="btn btn-primary mt-3" type="submit">Save persona and user</button>
    </form>
    <div class="mt-3">
        <form class="d-inline" method="post" th:action="@{/admin/bot/{id}/enabled/{enabled}(id=${bot.userId},enabled=${!bot.enabled})}"><button class="btn btn-secondary" th:text="${bot.enabled ? 'Disable' : 'Enable'}"></button></form>
        <form class="d-inline" method="post" th:action="@{/admin/bot/{id}/delete(id=${bot.userId})}" onsubmit="return confirm('Permanently delete this bot, its persona, and decks?')"><button class="btn btn-danger">Delete permanently</button></form>
    </div>
    <hr>
    <h2 th:text="|Selected deck: ${bot.selectedDeckName}|"></h2>
    <form method="post" th:action="@{/admin/bot/{id}/deck(id=${bot.userId})}">
        <table class="table"><thead><tr><th>Use</th><th>Card</th><th>Count</th></tr></thead><tbody>
        <tr th:each="card : ${cards}">
            <td><input type="checkbox" name="cardIds" th:value="${card.id}" onchange="this.closest('tr').querySelector('[name=counts]').disabled=!this.checked"></td>
            <td th:text="${card.name}"></td>
            <td><input class="form-control" type="number" name="counts" min="1" value="1" disabled></td>
        </tr></tbody></table>
        <button class="btn btn-primary">Replace selected deck cards</button>
    </form>
    <h3 class="mt-4">Current cards</h3>
    <ul><li th:each="card : ${bot.cards}" th:text="|${card.cardName} × ${card.count}|"></li></ul>
</main>
</body>
</html>
