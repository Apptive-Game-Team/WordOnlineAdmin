<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Admin - Parameter Management</title>
</head>

<body>

<div layout:fragment="content">
    <div class="container">
        <h1>Parameter Management</h1>
        <form class="form-inline mt-3 mb-3" method="get" action="/admin/parameter">
            <label class="mr-2" for="db-select">View DB</label>
            <select id="db-select" name="db" class="form-control mr-2" onchange="this.form.submit()">
                <option value="primary" th:selected="${selectedDb == 'primary'}">Prod</option>
                <option value="secondary" th:selected="${selectedDb == 'secondary'}" th:disabled="${!secondaryDatabaseEnabled}">Dev</option>
            </select>
            <button type="button" id="sync-to-secondary" class="btn btn-outline-secondary mr-2" th:disabled="${!secondaryDatabaseEnabled}">Prod -> Dev</button>
            <button type="button" id="sync-to-primary" class="btn btn-outline-secondary" th:disabled="${!secondaryDatabaseEnabled}">Dev -> Prod</button>
        </form>
        <!-- Parameter Management -->
        <div class="card mt-4">
            <div class="card-header">
                <h2>Parameters</h2>
            </div>
            <div class="card-body">
                <form id="createParameterForm" class="form-inline">
                    <div class="form-group mb-2">
                        <label for="parameterName" class="sr-only">Name</label>
                        <input type="text" class="form-control" id="parameterName" name="name" placeholder="New Parameter Name">
                    </div>
                    <button type="submit" class="btn btn-primary mb-2 ml-2">Create Parameter</button>
                </form>

                <div class="form-group mt-3">
                    <label for="parameter-search">Search</label>
                    <input type="text" class="form-control" id="parameter-search" placeholder="Search by id or name">
                </div>

                <table class="table table-striped mt-3">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="parameter-table-body">
                    <tr th:each="parameter : ${parameters}">
                        <td th:text="${parameter.id}"></td>
                        <td th:text="${parameter.name}"></td>
                        <td>
                            <form class="d-inline update-form">
                                <input type="hidden" name="id" th:value="${parameter.id}">
                                <input type="text" name="name" th:value="${parameter.name}" class="form-control d-inline w-auto">
                                <button type="submit" class="btn btn-sm btn-info">Update</button>
                            </form>
                            <form class="d-inline delete-form">
                                <input type="hidden" name="id" th:value="${parameter.id}">
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const selectedDb = /*[[${selectedDb}]]*/ 'primary';

        function getRowSearchText(row) {
            const inputText = Array.from(row.querySelectorAll('input, select, textarea'))
                .map(input => input.value || '')
                .join(' ');
            return `${row.innerText} ${inputText}`.toLowerCase();
        }

        document.getElementById('parameter-search').addEventListener('input', function(event) {
            const query = event.target.value.trim().toLowerCase();
            document.querySelectorAll('#parameter-table-body tr').forEach(row => {
                row.style.display = getRowSearchText(row).includes(query) ? '' : 'none';
            });
        });

        async function postSync(url) {
            try {
                const response = await fetch(url, { method: 'POST' });
                const message = await response.text();
                alert(message || (response.ok ? 'Sync completed.' : 'Sync failed.'));
                if (response.ok) {
                    window.location.reload();
                }
            } catch (error) {
                alert(`Sync failed: ${error.message}`);
            }
        }

        document.getElementById('createParameterForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const data = {
                name: formData.get('name')
            };

            fetch(`/api/admin/parameters?db=${selectedDb}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            }).then(response => {
                if (response.ok) {
                    window.location.reload();
                }
            });
        });

        document.querySelectorAll('.update-form').forEach(form => {
            form.addEventListener('submit', function(event) {
                event.preventDefault();
                const formData = new FormData(form);
                const id = formData.get('id');
                const data = {
                    name: formData.get('name')
                };

                fetch(`/api/admin/parameters/${id}?db=${selectedDb}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                }).then(response => {
                    if (response.ok) {
                        window.location.reload();
                    }
                });
            });
        });

        document.querySelectorAll('.delete-form').forEach(form => {
            form.addEventListener('submit', function(event) {
                event.preventDefault();
                const formData = new FormData(form);
                const id = formData.get('id');

                fetch(`/api/admin/parameters/${id}?db=${selectedDb}`, {
                    method: 'DELETE'
                }).then(response => {
                    if (response.ok) {
                        window.location.reload();
                    }
                });
            });
        });

        document.getElementById('sync-to-secondary').addEventListener('click', function() {
            if (!confirm('Sync prod parameters to dev DB?')) {
                return;
            }
            postSync('/api/admin/parameters/sync-to-secondary');
        });

        document.getElementById('sync-to-primary').addEventListener('click', function() {
            if (!confirm('Sync dev parameters to prod DB?')) {
                return;
            }
            postSync('/api/admin/parameters/sync-to-primary');
        });
    </script>
</div>

</body>
</html>
