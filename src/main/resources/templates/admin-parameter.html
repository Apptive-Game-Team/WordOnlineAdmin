<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Admin - Parameter Comparison</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container">
        <h1>Parameter Deploy / Dev Comparison</h1>

        <div class="mb-3">
            <button type="button" id="sync-to-secondary" class="btn btn-outline-secondary"
                    th:disabled="${!secondaryDatabaseEnabled}">Deploy -> Dev</button>
            <button type="button" id="sync-to-primary" class="btn btn-outline-secondary ml-2"
                    th:disabled="${!secondaryDatabaseEnabled}">Dev -> Deploy</button>
        </div>

        <div class="card mt-4">
            <div class="card-header"><h2>Parameters</h2></div>
            <div class="card-body">
                <form id="createParameterForm" class="form-inline">
                    <input type="text" class="form-control" name="name"
                           placeholder="New Parameter Name" required>
                    <select class="form-control ml-2" name="db">
                        <option value="primary">Deploy</option>
                        <option value="secondary" th:disabled="${!secondaryDatabaseEnabled}">Dev</option>
                    </select>
                    <button type="submit" class="btn btn-primary ml-2">Create</button>
                </form>

                <div class="form-group mt-3">
                    <label for="parameter-search">Search</label>
                    <input type="text" class="form-control" id="parameter-search"
                           placeholder="Search by name">
                </div>

                <table class="table table-striped mt-3">
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Deploy</th>
                        <th>Dev</th>
                    </tr>
                    </thead>
                    <tbody id="parameter-table-body">
                    <tr th:each="parameter : ${parameters}">
                        <td th:text="${parameter.name}"></td>
                        <td>
                            <span th:if="${!parameter.primaryPresent}" class="text-muted">N/A</span>
                            <form th:if="${parameter.primaryPresent}" class="d-inline database-form"
                                  data-db="primary" th:attr="data-current-name=${parameter.name}">
                                <input type="text" name="name" th:value="${parameter.name}"
                                       class="form-control d-inline w-auto">
                                <button type="submit" class="btn btn-sm btn-info">Update</button>
                                <button type="button" class="btn btn-sm btn-danger delete-button">Delete</button>
                            </form>
                        </td>
                        <td>
                            <span th:if="${!parameter.secondaryPresent}" class="text-muted">N/A</span>
                            <form th:if="${parameter.secondaryPresent}" class="d-inline database-form"
                                  data-db="secondary" th:attr="data-current-name=${parameter.name}">
                                <input type="text" name="name" th:value="${parameter.name}"
                                       class="form-control d-inline w-auto">
                                <button type="submit" class="btn btn-sm btn-info">Update</button>
                                <button type="button" class="btn btn-sm btn-danger delete-button">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('parameter-search').addEventListener('input', function(event) {
            const query = event.target.value.trim().toLowerCase();
            document.querySelectorAll('#parameter-table-body tr').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
            });
        });

        document.getElementById('createParameterForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const response = await fetch(`/api/admin/parameters/by-name?db=${formData.get('db')}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: formData.get('name')})
            });
            if (response.ok) {
                window.location.reload();
            } else {
                alert(await response.text());
            }
        });

        document.querySelectorAll('.database-form').forEach(form => {
            form.addEventListener('submit', async function(event) {
                event.preventDefault();
                const currentName = form.dataset.currentName;
                const newName = new FormData(form).get('name');
                const response = await fetch(
                    `/api/admin/parameters/by-name/${encodeURIComponent(currentName)}?db=${form.dataset.db}`,
                    {
                        method: 'PATCH',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({name: newName})
                    }
                );
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert(await response.text());
                }
            });

            form.querySelector('.delete-button').addEventListener('click', async function() {
                const currentName = form.dataset.currentName;
                if (!confirm(`Delete ${currentName} from ${form.dataset.db}?`)) {
                    return;
                }
                const response = await fetch(
                    `/api/admin/parameters/by-name/${encodeURIComponent(currentName)}?db=${form.dataset.db}`,
                    {method: 'DELETE'}
                );
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert(await response.text());
                }
            });
        });

        async function postSync(url, message) {
            if (!confirm(message)) {
                return;
            }
            const response = await fetch(url, {method: 'POST'});
            alert(await response.text());
            if (response.ok) {
                window.location.reload();
            }
        }

        document.getElementById('sync-to-secondary').addEventListener('click', function() {
            postSync('/api/admin/parameters/sync-to-secondary', 'Sync Deploy parameters to Dev?');
        });
        document.getElementById('sync-to-primary').addEventListener('click', function() {
            postSync('/api/admin/parameters/sync-to-primary', 'Sync Dev parameters to Deploy?');
        });
    </script>
</div>
</body>
</html>
