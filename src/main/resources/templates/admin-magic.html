<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Admin - Magic Comparison</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container py-4">
        <h1>Magic Deploy / Dev Comparison</h1>

        <div class="mb-3">
            <button type="button" id="sync-magic-to-secondary" class="btn btn-outline-secondary"
                    th:disabled="${!secondaryDatabaseEnabled}">Deploy -> Dev</button>
            <button type="button" id="sync-magic-to-primary" class="btn btn-outline-secondary ml-2"
                    th:disabled="${!secondaryDatabaseEnabled}">Dev -> Deploy</button>
        </div>

        <div class="card mb-4">
            <div class="card-header"><h4>Create Magic</h4></div>
            <div class="card-body">
                <form th:action="@{/admin/magic/by-name/create}" method="post" class="form-inline">
                    <input type="text" class="form-control" name="name" placeholder="Magic name" required>
                    <select class="form-control ml-2" name="db">
                        <option value="primary">Deploy</option>
                        <option value="secondary" th:disabled="${!secondaryDatabaseEnabled}">Dev</option>
                    </select>
                    <button type="submit" class="btn btn-primary ml-2">Create</button>
                </form>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header"><h4>Bulk Actions</h4></div>
            <div class="card-body">
                <div class="form-inline">
                    <select id="bulk-db" class="form-control">
                        <option value="primary">Deploy</option>
                        <option value="secondary" th:disabled="${!secondaryDatabaseEnabled}">Dev</option>
                    </select>
                    <select id="bulk-card-name" class="form-control ml-2">
                        <option value="">Select card</option>
                    </select>
                    <button type="button" id="bulk-add-card" class="btn btn-success ml-2">Add Card</button>
                    <button type="button" id="bulk-delete" class="btn btn-danger ml-2">Delete</button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="magic-search">Search</label>
            <input type="text" class="form-control" id="magic-search"
                   placeholder="Search magic or card name">
        </div>

        <div th:each="magic : ${magics}" class="card mb-4 magic-search-item">
            <div class="card-header">
                <label class="mb-0">
                    <input type="checkbox" class="magic-checkbox" th:value="${magic.name}">
                    <strong th:text="${magic.name}"></strong>
                </label>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h4>Deploy</h4>
                        <div th:if="${!magic.primaryPresent}" class="text-muted">N/A</div>
                        <div th:if="${magic.primaryPresent}">
                            <form th:action="@{/admin/magic/by-name/update}" method="post"
                                  class="form-inline mb-3">
                                <input type="hidden" name="db" value="primary">
                                <input type="hidden" name="currentName" th:value="${magic.name}">
                                <input type="text" class="form-control" name="name" th:value="${magic.name}">
                                <button class="btn btn-info ml-2" type="submit">Update</button>
                            </form>
                            <form th:action="@{/admin/magic/by-name/delete}" method="post" class="mb-3">
                                <input type="hidden" name="db" value="primary">
                                <input type="hidden" name="name" th:value="${magic.name}">
                                <button class="btn btn-danger" type="submit">Delete</button>
                            </form>
                            <form th:action="@{/admin/magic/by-name/add-card}" method="post"
                                  class="form-inline mb-3">
                                <input type="hidden" name="db" value="primary">
                                <input type="hidden" name="magicName" th:value="${magic.name}">
                                <select class="form-control" name="cardName">
                                    <option th:each="cardName : ${primaryCardNames}"
                                            th:value="${cardName}" th:text="${cardName}"></option>
                                </select>
                                <button class="btn btn-success ml-2" type="submit">Add Card</button>
                            </form>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h4>Dev</h4>
                        <div th:if="${!magic.secondaryPresent}" class="text-muted">N/A</div>
                        <div th:if="${magic.secondaryPresent}">
                            <form th:action="@{/admin/magic/by-name/update}" method="post"
                                  class="form-inline mb-3">
                                <input type="hidden" name="db" value="secondary">
                                <input type="hidden" name="currentName" th:value="${magic.name}">
                                <input type="text" class="form-control" name="name" th:value="${magic.name}">
                                <button class="btn btn-info ml-2" type="submit">Update</button>
                            </form>
                            <form th:action="@{/admin/magic/by-name/delete}" method="post" class="mb-3">
                                <input type="hidden" name="db" value="secondary">
                                <input type="hidden" name="name" th:value="${magic.name}">
                                <button class="btn btn-danger" type="submit">Delete</button>
                            </form>
                            <form th:action="@{/admin/magic/by-name/add-card}" method="post"
                                  class="form-inline mb-3">
                                <input type="hidden" name="db" value="secondary">
                                <input type="hidden" name="magicName" th:value="${magic.name}">
                                <select class="form-control" name="cardName">
                                    <option th:each="cardName : ${secondaryCardNames}"
                                            th:value="${cardName}" th:text="${cardName}"></option>
                                </select>
                                <button class="btn btn-success ml-2" type="submit">Add Card</button>
                            </form>
                        </div>
                    </div>
                </div>

                <table class="table table-sm table-striped mt-3">
                    <thead>
                    <tr>
                        <th>Card</th>
                        <th>Deploy</th>
                        <th>Dev</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="card : ${magic.cards}">
                        <td th:text="${card.name}"></td>
                        <td>
                            <span th:if="${!card.primaryPresent}" class="text-muted">N/A</span>
                            <form th:if="${card.primaryPresent}"
                                  th:action="@{/admin/magic/by-name/remove-card}" method="post">
                                <input type="hidden" name="db" value="primary">
                                <input type="hidden" name="magicName" th:value="${magic.name}">
                                <input type="hidden" name="cardName" th:value="${card.name}">
                                <button class="btn btn-sm btn-warning" type="submit">Remove</button>
                            </form>
                        </td>
                        <td>
                            <span th:if="${!card.secondaryPresent}" class="text-muted">N/A</span>
                            <form th:if="${card.secondaryPresent}"
                                  th:action="@{/admin/magic/by-name/remove-card}" method="post">
                                <input type="hidden" name="db" value="secondary">
                                <input type="hidden" name="magicName" th:value="${magic.name}">
                                <input type="hidden" name="cardName" th:value="${card.name}">
                                <button class="btn btn-sm btn-warning" type="submit">Remove</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const primaryCardNames = /*[[${primaryCardNames}]]*/ [];
        const secondaryCardNames = /*[[${secondaryCardNames}]]*/ [];

        function updateBulkCards() {
            const db = document.getElementById('bulk-db').value;
            const cardNames = db === 'secondary' ? secondaryCardNames : primaryCardNames;
            const select = document.getElementById('bulk-card-name');
            select.replaceChildren(new Option('Select card', ''));
            cardNames.forEach(cardName => select.add(new Option(cardName, cardName)));
        }

        document.getElementById('bulk-db').addEventListener('change', updateBulkCards);
        updateBulkCards();

        document.getElementById('magic-search').addEventListener('input', function(event) {
            const query = event.target.value.trim().toLowerCase();
            document.querySelectorAll('.magic-search-item').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(query) ? '' : 'none';
            });
        });

        function selectedMagicNames() {
            return Array.from(document.querySelectorAll('.magic-checkbox:checked'))
                .map(checkbox => checkbox.value);
        }

        function submitBulk(action, extra) {
            const names = selectedMagicNames();
            if (names.length === 0) {
                alert('Select at least one magic.');
                return;
            }
            const form = document.createElement('form');
            form.method = 'post';
            form.action = action;
            const values = {
                magicNames: names,
                db: document.getElementById('bulk-db').value,
                ...extra
            };
            Object.entries(values).forEach(([name, value]) => {
                (Array.isArray(value) ? value : [value]).forEach(item => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = name;
                    input.value = item;
                    form.appendChild(input);
                });
            });
            document.body.appendChild(form);
            form.submit();
        }

        document.getElementById('bulk-delete').addEventListener('click', function() {
            submitBulk('/admin/magic/by-name/bulk-delete', {});
        });
        document.getElementById('bulk-add-card').addEventListener('click', function() {
            const cardName = document.getElementById('bulk-card-name').value;
            if (!cardName) {
                alert('Select a card.');
                return;
            }
            submitBulk('/admin/magic/by-name/bulk-add-card', {cardName: cardName});
        });

        async function sync(url, message) {
            if (!confirm(message)) {
                return;
            }
            const response = await fetch(url, {method: 'POST'});
            alert(await response.text());
            if (response.ok) {
                window.location.reload();
            }
        }
        document.getElementById('sync-magic-to-secondary').addEventListener('click', function() {
            sync('/admin/magic/sync-to-secondary', 'Sync Deploy magic to Dev?');
        });
        document.getElementById('sync-magic-to-primary').addEventListener('click', function() {
            sync('/admin/magic/sync-to-primary', 'Sync Dev magic to Deploy?');
        });
    </script>
</div>
</body>
</html>
